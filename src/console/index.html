<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console RustDesk</title>
<style>
:root { --bg:#f3f6f8; --surface:#fff; --ink:#15202b; --muted:#5a6b78; --rule:#d5dee5; --accent:#0b7285; --accent-soft:#dceff3; --ok:#1e7f4f; --warn:#9a5a00; --bad:#b3261e; --mono: ui-monospace, "JetBrains Mono", Consolas, monospace; }
@media (prefers-color-scheme: dark) { :root { --bg:#0e1418; --surface:#151c22; --ink:#e4ebf0; --muted:#94a4b0; --rule:#26323b; --accent:#5fc3d6; --accent-soft:#12303a; --ok:#7bd3a1; --warn:#f0b563; --bad:#f0938c; } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin:0; font: 15px/1.5 system-ui, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.danger { color: var(--bad); border-color: var(--bad); }
button.small { padding: 3px 8px; font-size: 13px; }
button[disabled] { opacity: .5; cursor: default; }
input, select, textarea { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 10px; max-width: 100%; }
input[type=checkbox] { width: auto; }
textarea { width: 100%; font-family: var(--mono); font-size: 13px; }
label { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 2px; }
.layout { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
nav { background: var(--surface); border-right: 1px solid var(--rule); padding: 20px 14px; }
nav .brand { font-weight: 700; margin-bottom: 18px; font-size: 16px; }
nav a { display: block; padding: 8px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; }
nav a.on { background: var(--accent-soft); color: var(--accent); }
nav .me { margin-top: 24px; font-size: 13px; color: var(--muted); }
main { padding: 24px 32px; min-width: 0; }
h1 { font-size: 22px; margin: 0 0 16px; }
h2 { font-size: 17px; margin: 26px 0 8px; }
p { margin: 6px 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 8px; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; }
.card .k { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.card .v { font-size: 26px; font-weight: 600; }
.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--bg); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td .actions { display: flex; gap: 6px; flex-wrap: wrap; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--rule); margin-right: 6px; }
.dot.on { background: var(--ok); }
.mono { font-family: var(--mono); font-size: 13px; }
.muted { color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.row > div { min-width: 0; }
.form { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; margin: 12px 0; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--rule); white-space: nowrap; }
.tag.warn { color: var(--warn); border-color: var(--warn); }
.tag.bad { color: var(--bad); border-color: var(--bad); }
.tag.ok { color: var(--ok); border-color: var(--ok); }
.tag.accent { color: var(--accent); border-color: var(--accent); }
#login { max-width: 380px; margin: 12vh auto; padding: 0 16px; }
#login input { width: 100%; }
#toast { position: fixed; bottom: 20px; right: 20px; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 6px; display: none; z-index: 50; max-width: 360px; }
dialog { border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 20px 24px; width: min(560px, 92vw); }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog label { margin-top: 10px; }
dialog input:not([type=checkbox]), dialog select { width: 100%; }
.code { font-family: var(--mono); font-size: 34px; letter-spacing: .18em; text-align: center; margin: 14px 0; }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.tabs button.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.help { position: relative; display: inline-block; vertical-align: middle; margin-left: 6px; }
h1:has(.help), h2:has(.help) { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
h1:has(.help) .help, h2:has(.help) .help { margin-left: 0; }
.help-btn { width: 20px; height: 20px; padding: 0; border-radius: 50%; font-size: 12px; font-weight: 700; line-height: 18px; text-align: center; color: var(--accent); border-color: var(--accent); background: var(--surface); }
.help-tip { display: none; position: fixed; z-index: 40; width: min(340px, calc(100vw - 16px)); padding: 10px 12px; background: var(--ink); color: var(--bg); border-radius: 8px; font: 400 13px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; text-transform: none; letter-spacing: 0; white-space: normal; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
.help:hover .help-tip, .help.open .help-tip, .help-btn:focus-visible + .help-tip { display: block; }
@media (max-width: 800px) { .layout { grid-template-columns: 1fr; } nav { border-right: 0; border-bottom: 1px solid var(--rule); } main { padding: 16px; } }
</style>
</head>
<body>
<div id="login" hidden>
  <div class="form">
    <h1>Console RustDesk</h1>
    <label>Usuário</label><input id="lu" autocomplete="username">
    <label>Senha</label><input id="lp" type="password" autocomplete="current-password">
    <div style="margin-top:14px"><button class="primary" id="lb">Entrar</button></div>
    <p id="le" class="muted"></p>
  </div>
</div>
<div id="app" class="layout" hidden>
  <nav>
    <div class="brand">Console RustDesk</div>
    <a href="#/visao">Visão geral</a>
    <a href="#/grupos">Grupos</a>
    <a href="#/dispositivos">Dispositivos</a>
    <a href="#/usuarios">Usuários</a>
    <a href="#/acessos">Acessos</a>
    <a href="#/auditoria">Auditoria</a>
    <a href="#/config">Configurações</a>
    <div class="me"><span id="me"></span><br><a href="#" id="logout">Sair</a></div>
  </nav>
  <main id="main"></main>
</div>
<dialog id="dlg"><div id="dlgBody"></div><div style="text-align:right;margin-top:16px"><button id="dlgClose">Fechar</button></div></dialog>
<div id="toast"></div>
<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'value') e.value = v;
    else if (k === 'checked') e.checked = !!v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    e.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return e;
};

let TOKEN = localStorage.getItem('console_token') || '';
let ME = null;

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  const res = await fetch(path, { method: opts.method || 'GET', headers, body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined });
  const text = await res.text();
  let data = text;
  try { data = text ? JSON.parse(text) : null; } catch (_) { /* texto puro (script de instalação) */ }
  if (res.status === 401 && !opts.noAuth) { logout(); $('#le').textContent = 'Sessão expirada — entre de novo.'; throw new Error('Sessão expirada'); }
  if (!res.ok || (data && typeof data === 'object' && data.error)) throw new Error((data && data.error) || ('HTTP ' + res.status));
  return data;
}

let toastTimer = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', 3500); }
function fail(e) { toast('Erro: ' + (e && e.message ? e.message : e)); }
function fmtTs(ts) { return ts ? new Date(ts * 1000).toLocaleString('pt-BR') : '—'; }
function fmtAgo(ts, now) { if (!ts) return 'nunca'; const s = Math.max(0, (now || Math.floor(Date.now() / 1000)) - ts); if (s < 60) return s + ' s'; if (s < 3600) return Math.floor(s / 60) + ' min'; if (s < 86400) return Math.floor(s / 3600) + ' h'; return Math.floor(s / 86400) + ' d'; }
function fmtDur(a, b) { if (!a || !b) return '—'; const s = b - a; if (s < 60) return s + ' s'; if (s < 3600) return Math.floor(s / 60) + ' min'; return (s / 3600).toFixed(1) + ' h'; }
function toInput(ts) { if (!ts) return ''; const d = new Date(ts * 1000); const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function fromInput(v) { if (!v) return null; const t = Math.floor(new Date(v).getTime() / 1000); return Number.isFinite(t) ? t : null; }
function copyText(text) {
  const done = () => toast('Copiado');
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(done).catch(() => legacyCopy(text, done));
  legacyCopy(text, done);
}
function legacyCopy(text, done) { const ta = el('textarea', {}, text); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.append(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (_) { toast('Não foi possível copiar'); } ta.remove(); }
function dialog(...nodes) { $('#dlgBody').replaceChildren(...nodes); $('#dlg').showModal(); }
$('#dlgClose').onclick = () => $('#dlg').close();

const RULES = { 1: 'Somente leitura', 2: 'Leitura e escrita', 3: 'Controle total' };
const CONN_TYPES = { 0: 'Área de trabalho', 1: 'Arquivos', 2: 'Túnel/RDP', 3: 'Câmera', 4: 'Terminal' };
const AUTHS = { 1: 'aceite manual', 2: 'senha temporária', 3: 'senha permanente', 4: 'troca de lados' };
const TFAS = { 1: 'TOTP', 2: 'dispositivo confiável' };
const ALARMS = { 0: 'IP fora da whitelist', 1: 'mais de 30 tentativas', 2: '6 tentativas em 1 min', 6: 'tentativas por prefixo IPv6', 7: 'backoff de login no terminal', 8: 'concorrência de login no terminal', 9: 'violação de escopo de sessão', 10: 'ID fora da whitelist' };
const KINDS = { staff: 'equipe', external: 'externo' };

function table(headers, rows, empty = 'Nada por aqui.') {
  if (!rows.length) return el('p', { class: 'muted' }, empty);
  return el('div', { class: 'tbl' }, el('table', {},
    el('thead', {}, el('tr', {}, headers.map(h => el('th', {}, h)))),
    el('tbody', {}, rows.map(r => el('tr', {}, r.map(c => el('td', {}, c)))))));
}
function select(options, value, attrs = {}) {
  const s = el('select', attrs);
  for (const [v, label] of options) s.append(el('option', { value: v, selected: String(v) === String(value) ? true : null }, label));
  return s;
}
function field(label, input) { return el('div', {}, el('label', {}, label), input); }
function tag(text, cls) { return el('span', { class: 'tag ' + (cls || '') }, text); }
// estado da senha do grupo na máquina (cliente personalizado sincroniza pelo heartbeat)
function syncTag(d) {
  if (!d.sync_client) return el('span', { class: 'muted', title: 'Fora de grupo: atribua a máquina a um grupo para o servidor enviar a senha (RustDesk comum não recebe).' }, 'manual');
  return d.password_synced ? tag('sincronizada', 'ok') : tag('pendente', 'warn');
}
// Ícone "?" com a explicação: aparece ao passar o mouse (desktop) ou ao tocar (mobile).
function help(text) {
  const tip = el('span', { class: 'help-tip', role: 'tooltip' }, text);
  const btn = el('button', { class: 'help-btn', type: 'button', 'aria-label': 'Ajuda' }, '?');
  const box = el('span', { class: 'help' }, btn, tip);
  // balão fixo na tela, logo abaixo do ícone, sempre dentro da largura da janela
  const place = () => { const r = btn.getBoundingClientRect(); tip.style.top = (r.bottom + 6) + 'px'; tip.style.left = '0px'; const w = tip.getBoundingClientRect().width; tip.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 8 - w)) + 'px'; };
  btn.onclick = e => { e.preventDefault(); e.stopPropagation(); const open = !box.classList.contains('open'); closeHelps(); if (open) { box.classList.add('open'); place(); } };
  box.onmouseenter = place;
  return box;
}
function closeHelps() { document.querySelectorAll('.help.open').forEach(h => h.classList.remove('open')); }
document.addEventListener('click', closeHelps);
window.addEventListener('scroll', closeHelps, true);

// ---------------------------------------------------------------- login / boot
async function login() {
  const username = $('#lu').value.trim(), password = $('#lp').value;
  $('#le').textContent = '';
  try {
    const base = { username, id: 'console', uuid: 'console', autoLogin: true, deviceInfo: { os: 'web', type: 'browser', name: 'console' } };
    let r = await api('/api/login', { method: 'POST', noAuth: true, body: { ...base, password, type: 'account' } });
    if (r.type === 'email_check') {
      const code = prompt('Esta conta exige um código de acesso. Digite o código:');
      if (!code) return;
      r = await api('/api/login', { method: 'POST', noAuth: true, body: { ...base, type: 'email_code', secret: r.secret, tfaCode: code.trim(), verificationCode: code.trim() } });
    }
    if (r.type !== 'access_token') throw new Error('Resposta inesperada do servidor');
    TOKEN = r.access_token; localStorage.setItem('console_token', TOKEN);
    await boot();
  } catch (e) { $('#le').textContent = e.message; }
}
function logout() {
  if (TOKEN) fetch('/api/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' }, body: '{}' }).catch(() => {});
  TOKEN = ''; ME = null; localStorage.removeItem('console_token');
  $('#app').hidden = true; $('#login').hidden = false;
}
async function boot() {
  if (!TOKEN) { $('#login').hidden = false; return; }
  try {
    ME = await api('/api/currentUser', { method: 'POST', body: { id: 'console', uuid: 'console' } });
  } catch (e) { $('#login').hidden = false; return; }
  if (!ME.is_admin) { $('#le').textContent = 'Esta conta não é administradora.'; logout(); return; }
  $('#me').textContent = ME.display_name || ME.name;
  $('#login').hidden = true; $('#app').hidden = false;
  if (!location.hash) location.hash = '#/visao';
  render();
}
$('#lb').onclick = login;
$('#lp').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('#logout').onclick = e => { e.preventDefault(); logout(); };

// ---------------------------------------------------------------- roteador
const pages = { visao: pageOverview, grupos: pageGroups, dispositivos: pageDevices, usuarios: pageUsers, acessos: pageGrants, auditoria: pageAudit, config: pageConfig };
async function render() {
  if (!ME) return;
  const parts = location.hash.replace(/^#\/?/, '').split('/');
  const seg = parts[0] || 'visao', arg = parts[1];
  document.querySelectorAll('nav a[href^="#/"]').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#/' + seg));
  const main = $('#main');
  main.replaceChildren(el('p', { class: 'muted' }, 'Carregando…'));
  try { await (pages[seg] || pageOverview)(main, arg); } catch (e) { main.replaceChildren(el('p', {}, 'Erro: ' + e.message)); }
}
window.addEventListener('hashchange', render);

// ---------------------------------------------------------------- visão geral
async function pageOverview(main) {
  const o = await api('/admin/api/overview');
  const cards = [['Dispositivos', o.devices], ['Online agora', o.online], ['Sem grupo', o.unassigned], ['Grupos', o.groups], ['Usuários', o.users], ['Externos', o.externals], ['Conexões 24h', o.connections_24h], ['Sessões abertas', o.active_sessions]];
  main.replaceChildren(
    el('h1', {}, 'Visão geral'),
    el('div', { class: 'cards' }, cards.map(([k, v]) => el('div', { class: 'card' }, el('div', { class: 'k' }, k), el('div', { class: 'v' }, v)))),
    el('h2', {}, 'Grupos'),
    table(['Grupo', 'Máquinas', 'Online'], o.per_group.map(s => [el('a', { href: '#/grupos/' + s.id }, s.name), s.devices, el('span', {}, el('span', { class: 'dot' + (s.online ? ' on' : '') }), s.online)]), 'Nenhum grupo ainda — crie em Grupos.'),
    el('h2', {}, 'Últimas conexões'),
    connTable(o.recent),
  );
}
function connTable(rows) {
  return table(['Quando', 'Grupo', 'Máquina', 'Quem conectou', 'Tipo', 'Autenticação', 'Duração', 'Nota'], rows.map(r => [
    fmtTs(r.started_at), r.group || '—', el('span', {}, r.hostname || '', ' ', el('span', { class: 'mono muted' }, r.device_id)),
    el('span', {}, r.peer_name || '', ' ', el('span', { class: 'mono muted' }, r.peer_id), r.ip ? el('span', { class: 'muted' }, ' · ' + r.ip) : ''),
    CONN_TYPES[r.conn_type] ?? (r.authed_at ? '?' : 'não autenticou'),
    (AUTHS[r.primary_auth] || '—') + (r.two_factor ? ' + ' + (TFAS[r.two_factor] || '2FA') : ''),
    r.closed_at ? fmtDur(r.started_at, r.closed_at) : (r.authed_at ? tag('em andamento', 'ok') : '—'), r.note || '']), 'Nenhuma conexão registrada.');
}

// ---------------------------------------------------------------- grupos
async function pageGroups(main, id) {
  if (id) return pageGroup(main, Number(id));
  const groups = await api('/admin/api/groups');
  const form = el('div', { class: 'form' });
  const name = el('input', { placeholder: 'ex.: Posto Centro, Loja 2, Matriz' }), pass = el('input', { placeholder: 'em branco = gera' }), note = el('input', { placeholder: 'opcional' });
  form.append(el('h2', { style: 'margin-top:0' }, 'Novo grupo'), el('div', { class: 'row' }, field('Nome', name), field('Senha permanente das máquinas', pass), field('Nota', note),
    el('div', {}, el('button', { class: 'primary', onclick: async () => { try { const s = await api('/admin/api/groups', { method: 'POST', body: { name: name.value, password: pass.value, note: note.value } }); toast('Grupo criado'); location.hash = '#/grupos/' + s.id; } catch (e) { fail(e); } } }, 'Criar'))));
  main.replaceChildren(
    el('h1', {}, 'Grupos', help('Um grupo reúne as máquinas de uma unidade (posto, loja, filial). Elas compartilham uma senha e aparecem juntas no RustDesk de quem tem acesso, que conecta com um clique, sem ninguém precisar aceitar na tela.')),
    form,
    table(['Grupo', 'Máquinas', 'Online', 'Acessos', 'Nota', ''], groups.map(s => [
      el('span', {}, el('a', { href: '#/grupos/' + s.id }, s.name), s.require_login ? [' ', tag('exige login', 'accent')] : ''), s.devices, el('span', {}, el('span', { class: 'dot' + (s.online ? ' on' : '') }), s.online),
      s.grants.length, s.note || '', el('a', { href: '#/grupos/' + s.id }, 'abrir')]), 'Nenhum grupo ainda.'));
}

async function pageGroup(main, id) {
  const [groups, devices, allDevices, users] = await Promise.all([api('/admin/api/groups'), api('/admin/api/devices?group=' + id), api('/admin/api/devices'), api('/admin/api/users')]);
  const s = groups.find(x => x.id === id);
  if (!s) { main.replaceChildren(el('p', {}, 'Grupo não encontrado.')); return; }
  const reload = () => pageGroup(main, id);

  // cabeçalho
  const header = el('div', { class: 'row', style: 'justify-content:space-between' },
    el('div', {}, el('h1', { style: 'margin-bottom:4px' }, s.name), el('span', { class: 'muted' }, s.note || '')),
    el('div', { class: 'actions', style: 'display:flex;gap:6px' },
      el('button', { onclick: async () => { const n = prompt('Novo nome do grupo:', s.name); if (n && n !== s.name) { try { await api('/admin/api/groups/' + id, { method: 'PUT', body: { name: n } }); reload(); } catch (e) { fail(e); } } } }, 'Renomear'),
      el('button', { onclick: async () => { const n = prompt('Nota:', s.note || ''); if (n !== null) { try { await api('/admin/api/groups/' + id, { method: 'PUT', body: { note: n } }); reload(); } catch (e) { fail(e); } } } }, 'Nota'),
      el('button', { class: 'danger', onclick: async () => { if (!confirm(`Apagar o grupo "${s.name}"? As máquinas ficam sem grupo e o address book dele é removido.`)) return; try { await api('/admin/api/groups/' + id, { method: 'DELETE' }); location.hash = '#/grupos'; } catch (e) { fail(e); } } }, 'Apagar')));

  // senha
  const pw = el('span', { class: 'mono' }, '••••••••••••');
  let shown = false;
  const pwCard = el('div', { class: 'form' }, el('h2', { style: 'margin-top:0' }, 'Senha do grupo', help('A senha que as máquinas do grupo aceitam. Quem tem acesso ao grupo entra com ela automaticamente. Trocar aqui vale na hora para quem acessa. Máquinas com o cliente personalizado aplicam sozinhas; nas outras, rode o script de instalação de novo.')),
    el('p', {}, pw, ' ',
      el('button', { class: 'small', onclick: () => { shown = !shown; pw.textContent = shown ? s.password : '••••••••••••'; } }, 'mostrar/ocultar'), ' ',
      el('button', { class: 'small', onclick: () => copyText(s.password) }, 'copiar'), ' ',
      el('button', { class: 'small', onclick: async () => { const n = prompt('Nova senha (em branco cancela):'); if (!n) return; try { await api('/admin/api/groups/' + id, { method: 'PUT', body: { password: n } }); toast('Senha alterada — atualize as máquinas'); reload(); } catch (e) { fail(e); } } }, 'definir'), ' ',

    else t = table(['Quando', 'Grupo', 'Máquina', 'Alarme', 'Detalhes'], rows.map(x => [fmtTs(x.created_at), x.group || '—', el('span', {}, x.hostname || '', ' ', el('span', { class: 'mono muted' }, x.device_id)), tag(ALARMS[x.typ] || ('tipo ' + x.typ), 'bad'), el('span', { class: 'mono' }, typeof x.info === 'object' ? JSON.stringify(x.info) : String(x.info))]), 'Nenhum alarme.');
    list.replaceChildren(el('p', { class: 'muted' }, `${rows.length} de ${r.total}`), t, rows.length < r.total ? more : '');
  };
  const tabs = el('div', { class: 'tabs' }, [['conn', 'Conexões'], ['file', 'Arquivos'], ['alarm', 'Alarmes'], ['denied', 'Recusadas']].map(([k, label]) => el('button', { class: k === kind ? 'on' : '', onclick: e => { kind = k; tabs.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === e.target)); load(); } }, label)));
  stSel.onchange = () => load(); devIn.addEventListener('input', () => { clearTimeout(devIn._t); devIn._t = setTimeout(() => load(), 300); }); sinceIn.onchange = () => load();
  main.replaceChildren(el('h1', {}, 'Auditoria'), tabs, el('div', { class: 'row', style: 'margin-bottom:12px' }, field('Grupo', stSel), field('Máquina', devIn), field('Desde', sinceIn)), list);
  await load();
}

// ---------------------------------------------------------------- configurações
async function pageConfig(main) {
  const s = await api('/admin/api/settings');
  const f = { server_host: el('input', { value: s.server_host, placeholder: 'rustdesk.exemplo.com.br' }), server_key: el('input', { value: s.server_key, placeholder: 'conteúdo de id_ed25519.pub' }), api_url: el('input', { value: s.api_url || location.origin, placeholder: location.origin }), download_url: el('input', { value: s.download_url, placeholder: 'https://github.com/…/releases/download/…/RustdeskOlirio-1.4.9-x86_64.exe' }), client_app_name: el('input', { value: s.client_app_name || '', placeholder: 'ex.: RustdeskOlirio' }), client_version: el('input', { value: s.client_version || '', placeholder: 'ex.: 1.4.9' }) };
  Object.values(f).forEach(i => i.style.width = '100%');
  const envText = `API_AUTH_URL=http://127.0.0.1:${location.port || 21114}/api/internal/authorize\nAPI_AUTH_SECRET=${s.hbbs_secret}`;
  const reqGroup = el('input', { type: 'checkbox', checked: s.require_group === '1' });
  const hbbsCard = el('div', { class: 'form', style: 'max-width:720px;margin-top:16px' }, el('h2', { style: 'margin-top:0' }, 'Integração com o servidor RustDesk (hbbs)', help('Faz o servidor RustDesk consultar este console antes de cada conexão e recusar quem não está logado ou não tem acesso, nos grupos com "Exigir login". Cole as variáveis no serviço hbbs e reinicie-o; ajuste o endereço se o console roda em outra máquina. Se o console estiver fora do ar, as conexões são recusadas (API_AUTH_FAIL_OPEN=Y inverte). As recusas ficam em Auditoria → Recusadas.')),
    el('pre', { class: 'mono', style: 'white-space:pre-wrap;user-select:all' }, envText),
    el('button', { class: 'small', onclick: () => copyText(envText) }, 'copiar'),
    el('h2', {}, 'Política global', help('Com a integração ativa, o hbbs recusa conexões a qualquer máquina que não esteja cadastrada em um grupo do console, inclusive IDs desconhecidos. Quem tiver só o endereço e a chave do servidor não consegue chegar a máquina nenhuma. Vale para todo mundo, administradores incluídos: para conectar numa máquina nova, coloque-a num grupo antes.')),
    el('label', {}, reqGroup, ' Bloquear conexões a máquinas fora de grupo (inclusive desconhecidas)'),
    el('button', { class: 'primary', onclick: async () => { try { await api('/admin/api/settings', { method: 'PUT', body: { require_group: reqGroup.checked ? '1' : '0' } }); toast('Política salva'); } catch (e) { fail(e); } } }, 'Salvar política'));
  // instaladores hospedados na API
  const filesCard = el('div', { class: 'form', style: 'max-width:720px;margin-top:16px' }, el('h2', { style: 'margin-top:0' }, 'Instaladores no servidor', help('Arquivos guardados nesta API e servidos em /downloads/<nome>. O download exige o token de matrícula de um grupo, que o script de instalação já envia, então o link não fica público. Envie aqui o instalador gerado pelo build do cliente personalizado e clique em "usar no script".')));
  const filesList = el('div', {});
  const fileIn = el('input', { type: 'file' });
  let installerToken = s.installer_token || '';
  const tokenIn = el('input', { value: installerToken, readonly: true, style: 'width:100%' });
  const loadFiles = async () => {
    const files = await api('/admin/api/downloads');
    filesList.replaceChildren(table(['Arquivo', 'Tamanho', 'Enviado em', ''], files.map(x => [el('span', { class: 'mono' }, x.name), (x.size / 1048576).toFixed(1) + ' MB', fmtTs(x.modified_at),
      el('div', { class: 'actions' },
        el('button', { class: 'small', onclick: async () => { try { const r = await fetch('/downloads/' + encodeURIComponent(x.name), { headers: { 'Authorization': 'Bearer ' + TOKEN } }); if (!r.ok) throw new Error('HTTP ' + r.status); const blob = await r.blob(); const a = el('a', { href: URL.createObjectURL(blob), download: x.name }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 15000); } catch (e) { fail(e); } } }, 'baixar'),
        el('button', { class: 'small', onclick: () => { const base = (f.api_url.value || location.origin).replace(/\/$/, ''); copyText(base + '/downloads/' + encodeURIComponent(x.name) + '?token=' + installerToken); } }, 'copiar link'),
        el('button', { class: 'small', onclick: async () => { const url = (f.api_url.value || location.origin).replace(/\/$/, '') + '/downloads/' + x.name; f.download_url.value = url; const m = x.name.match(/-(\d+\.\d+\.\d+(?:-\d+)?)-/); const body = { download_url: url }; if (m) { body.client_version = m[1]; f.client_version.value = m[1]; } try { await api('/admin/api/settings', { method: 'PUT', body }); toast('O script instala ' + x.name + (m ? ' e as máquinas atualizam para ' + m[1] : '')); } catch (e) { fail(e); } } }, 'usar no script'),
        el('button', { class: 'small danger', onclick: async () => { if (!confirm('Apagar ' + x.name + '?')) return; try { await api('/admin/api/downloads/' + encodeURIComponent(x.name), { method: 'DELETE' }); loadFiles(); } catch (e) { fail(e); } } }, 'apagar'))]), 'Nenhum instalador enviado.'));
  };
  filesCard.append(filesList, el('div', { class: 'row', style: 'margin-top:10px' }, field('Enviar instalador (.exe)', fileIn), el('div', {}, el('button', { onclick: async () => {
    const file = fileIn.files[0]; if (!file) return toast('Escolha um arquivo');
    toast('Enviando ' + file.name + '…');
    try {
      const r = await fetch('/admin/api/downloads/' + encodeURIComponent(file.name), { method: 'PUT', headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/octet-stream' }, body: file });
      const d = await r.json(); if (!r.ok || d.error) throw new Error(d.error || ('HTTP ' + r.status));
      toast('Enviado'); fileIn.value = ''; loadFiles();
    } catch (e) { fail(e); } } }, 'Enviar'))));
  filesCard.append(el('div', { style: 'margin-top:14px' },
    el('div', {}, el('label', {}, 'Token de download de instaladores', ' ', help('Use no fim do link (?token=...) para entregar um instalador sem dar um token de grupo — este só baixa, não matricula máquinas. Ex.: para o técnico baixar a versão operador. "copiar link" em cada arquivo já monta a URL com este token. "rotacionar" invalida o token antigo.')), tokenIn),
    el('div', { class: 'actions', style: 'margin-top:8px' },
      el('button', { class: 'small', onclick: () => copyText(installerToken) }, 'copiar token'),
      el('button', { class: 'small danger', onclick: async () => { if (!confirm('Rotacionar o token? Links antigos param de funcionar.')) return; try { const r = await api('/admin/api/installer-token/rotate', { method: 'POST' }); installerToken = r.installer_token; tokenIn.value = installerToken; toast('Token rotacionado'); } catch (e) { fail(e); } } }, 'rotacionar'))));
  loadFiles();
  main.replaceChildren(el('h1', {}, 'Configurações', help('Dados usados para montar o script de instalação: endereço e chave do seu servidor RustDesk, endereço deste console e o instalador. Com um cliente personalizado (nome do app), o script instala esse cliente, que já traz servidor e chave fixos e recebe a senha do grupo sozinho.')),
    el('div', { class: 'form', style: 'max-width:720px' }, field('Servidor de ID (hbbs)', f.server_host), field('Chave pública do servidor (Key)', f.server_key), field('URL da API', f.api_url), field('Link do instalador (Windows .exe)', f.download_url), field('Cliente personalizado: nome do app (vazio = RustDesk oficial)', f.client_app_name), el('div', {}, field('Versão publicada do cliente', f.client_version), help('As máquinas dos grupos que rodam uma versão mais antiga baixam este instalador e se atualizam sozinhas (quando ociosas). Preenchido automaticamente ao clicar "usar no script". Deixe vazio para não forçar atualização.')),
      el('div', { style: 'margin-top:12px' }, el('button', { class: 'primary', onclick: async () => { try { await api('/admin/api/settings', { method: 'PUT', body: Object.fromEntries(Object.entries(f).map(([k, i]) => [k, i.value])) }); toast('Salvo'); } catch (e) { fail(e); } } }, 'Salvar'))),
    hbbsCard, filesCard);
}

boot();
</script>
